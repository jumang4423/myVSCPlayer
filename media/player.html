<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="{{STYLE}}" />
<title>myVSCPlayer</title>
</head>
<body data-state="empty">
  <div class="card">
    <header class="head">
      <button id="play" class="play" title="Play / pause (Space)" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5v13l10.5-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5h3.4v14H7.5zM13.1 5h3.4v14h-3.4z"/></svg>
      </button>

      <div class="meta">
        <h1 id="title">myVSCPlayer</h1>
        <p id="artist"></p>
      </div>

      <div class="nav">
        <button id="prev" class="ghost" title="Previous (P)" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2.2v12H7z"/><path d="M18 6.4v11.2L9.6 12z"/></svg>
        </button>
        <button id="next" class="ghost" title="Next (N)" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 6H17v12h-2.2z"/><path d="M6 6.4v11.2L14.4 12z"/></svg>
        </button>
      </div>
    </header>

    <section id="stage" class="stage">
      <canvas id="wave"></canvas>
      <div id="hint" class="hint">waiting for audio…</div>
      <div id="tip" class="tip" hidden></div>
    </section>

    <footer class="foot">
      <div class="left">
        <button id="sep" class="pill" title="Stem-separate a selected range">SEP</button>
        <button id="loop" class="pill" title="Loop (L)">LOOP</button>
        <select id="rate" title="Speed">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
        <div class="volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.4h3.3L12 5.5v13L7.3 14.6H4z"/><path d="M15 9.2a3.9 3.9 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" title="Volume (up / down arrows)" />
        </div>
      </div>
      <div class="clock">
        <span id="elapsed">0:00</span>
        <span class="dim">/</span>
        <span id="total" class="dim">0:00</span>
      </div>
    </footer>
  </div>

  <script nonce="{{NONCE}}" src="{{SCRIPT}}"></script>
</body>
</html>
